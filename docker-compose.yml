version: '3.8'

services:
  # 1. Metabase Dashboard
  metabase:
    image: metabase/metabase:latest
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_PORT: 5432
      MB_DB_USER: ${NEON_USER}
      MB_DB_PASS: ${NEON_PASSWORD}
      MB_DB_HOST: ${NEON_HOST}
      MB_DB_DBNAME: neondb
      MB_DB_SSL: "true"

  # 2. Local Python Scraper Runner
  scraper:
    build: .
    env_file:
      - .env